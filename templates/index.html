<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SURYA — Happy Birthday</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #02030b;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;
        }


        #app {

            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #171746 0%,
                    #08091e 45%,
                    #010207 100%
                );
        }


        /* =====================================
           CANVAS
        ===================================== */

        #canvas {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }


        /* =====================================
           OVERLAY
        ===================================== */

        .overlay {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            z-index: 5;

            pointer-events: none;
        }


        .scene {

            position: absolute;

            width: 94%;
            max-width: 1100px;

            opacity: 0;

            transform: scale(0.92);

            transition:
                opacity 1s ease,
                transform 1s ease;

            pointer-events: none;
        }


        .scene.active {

            opacity: 1;

            transform: scale(1);

            pointer-events: auto;
        }


        /* =====================================
           LOADING
        ===================================== */

        .loading {

            font-size:
                clamp(25px, 4vw, 55px);

            letter-spacing: 2px;

            text-shadow:
                0 0 20px #9b7cff,
                0 0 50px #5d4aff;
        }


        .sub {

            margin-top: 20px;

            font-size:
                clamp(13px, 2vw, 21px);

            opacity: 0.7;

            letter-spacing: 4px;
        }


        /* =====================================
           COUNTDOWN
        ===================================== */

        .count {

            font-size:
                clamp(100px, 20vw, 230px);

            font-weight: 900;

            color: #ffd85c;

            text-shadow:
                0 0 15px #ffd85c,
                0 0 70px #ff8a00;
        }


        /* =====================================
           SURYA
        ===================================== */

        .name {

            font-size:
                clamp(75px, 16vw, 190px);

            font-weight: 900;

            letter-spacing: 10px;

            background:
                linear-gradient(
                    90deg,
                    #ff5fa2,
                    #ffd85c,
                    #6de8ff,
                    #c47cff
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

            text-shadow: none;
        }


        /* =====================================
           BIRTHDAY
        ===================================== */

        .birthday {

            font-size:
                clamp(40px, 8vw, 100px);

            font-weight: 900;

            line-height: 1.15;

            text-shadow:
                0 0 15px #ff4fa3,
                0 0 45px #7b5cff;
        }


        /* =====================================
           MESSAGE
        ===================================== */

        .message {

            max-width: 900px;

            margin: auto;

            font-size:
                clamp(19px, 3vw, 37px);

            line-height: 1.7;

            text-shadow:
                0 0 20px
                rgba(255, 80, 170, .5);
        }


        .message strong {

            color: #ffd85c;
        }


        /* =====================================
           PHOTO TITLE
        ===================================== */

        .photo-title {

            margin-bottom: 22px;

            font-size:
                clamp(45px, 8vw, 90px);

            font-weight: 900;

            color: #ffd85c;

            text-shadow:
                0 0 15px #ff4fa3,
                0 0 45px #7b5cff;
        }


        /* =====================================
           PHOTO SLIDESHOW
        ===================================== */

        .photo-slideshow {

            position: relative;

            width: min(90vw, 750px);

            height: min(65vh, 500px);

            margin: 0 auto;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            border-radius: 25px;

            background:
                radial-gradient(
                    circle,
                    #30205c,
                    #050510
                );

            border:
                2px solid
                rgba(255, 255, 255, .5);

            box-shadow:
                0 0 25px
                rgba(255, 80, 170, .6),

                0 0 80px
                rgba(100, 80, 255, .35);
        }


        /*
           IMPORTANT:
           contain = FULL PHOTO VISIBLE
           cover = photo crop avuthundi
        */

        .photo-slide {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            object-position: center center;

            opacity: 0;

            transform: none;

            transition:
                opacity 1s ease;
        }


        .photo-slide.active {

            opacity: 1;

            transform: none;
        }


        .photo-caption {

            margin-top: 15px;

            font-size: 22px;

            opacity: .8;
        }


        /* =====================================
           MUSIC BUTTON
        ===================================== */

        .music-button {

            position: fixed;

            top: 20px;
            right: 20px;

            z-index: 100;

            padding:
                12px 20px;

            border: 1px solid
                rgba(255, 255, 255, .5);

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    #7b3cff,
                    #ff3f9f
                );

            color: white;

            font-size: 15px;

            cursor: pointer;

            box-shadow:
                0 0 15px #9a4dff,
                0 0 35px
                rgba(255, 55, 160, .5);

            transition: .25s;
        }


        .music-button:hover {

            transform: scale(1.08);
        }


        /* =====================================
           SURPRISE BUTTON
        ===================================== */

        .surprise-button {

            padding:
                18px 40px;

            border:
                1px solid
                rgba(255, 255, 255, .7);

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    #7b3cff,
                    #ff3f9f
                );

            color: white;

            font-size:
                clamp(17px, 2.5vw, 26px);

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 0 20px #9a4dff,
                0 0 60px
                rgba(255, 55, 160, .5);

            animation:
                buttonPulse 1.8s infinite;

            transition: .25s;
        }


        .surprise-button:hover {

            transform: scale(1.08);
        }


        /* =====================================
           FINAL
        ===================================== */

        .heart {

            font-size:
                clamp(80px, 14vw, 160px);

            filter:
                drop-shadow(
                    0 0 25px #ff2f78
                );

            animation:
                heartBeat 1s infinite;
        }


        .final {

            margin-top: 15px;

            font-size:
                clamp(32px, 7vw, 85px);

            font-weight: 900;

            line-height: 1.2;

            text-shadow:
                0 0 18px #ff4fa3,
                0 0 60px #ff2f91;
        }


        .final small {

            display: block;

            margin-top: 25px;

            font-size:
                clamp(16px, 3vw, 30px);

            letter-spacing: 4px;

            color: #ffd85c;
        }


        .hint {

            position: absolute;

            bottom: 18px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 10;

            font-size: 11px;

            letter-spacing: 2px;

            opacity: .4;
        }


        /* =====================================
           ANIMATIONS
        ===================================== */

        @keyframes buttonPulse {

            50% {
                transform: scale(1.04);
            }

        }


        @keyframes heartBeat {

            50% {
                transform: scale(1.15);
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .photo-slideshow {

                width: 92vw;

                height: 58vh;

                border-radius: 18px;
            }


            .photo-slide {

                object-fit: contain;
            }


            .music-button {

                top: 12px;
                right: 12px;

                padding:
                    10px 15px;

                font-size: 13px;
            }


            .name {

                letter-spacing: 5px;
            }

        }

    </style>

</head>


<body>


<div id="app">


    <!-- =====================================
         CANVAS
    ====================================== -->

    <canvas id="canvas"></canvas>


    <!-- =====================================
         MUSIC
    ====================================== -->

    <audio
        id="birthdayMusic"
        loop
        preload="auto"
    >

        <source
            src="{{ url_for('static', filename='music/birthday.mp3') }}"
            type="audio/mpeg"
        >

    </audio>


    <button
        id="musicButton"
        class="music-button"
    >
        🎵 Music OFF
    </button>


    <!-- =====================================
         ALL SCENES
    ====================================== -->

    <div class="overlay">


        <!-- LOADING -->

        <section
            id="loading"
            class="scene active"
        >

            <div class="loading">

                Something special is loading...

            </div>

            <div class="sub">

                FOR MY BEST FRIEND SURYA

            </div>

        </section>


        <!-- COUNTDOWN -->

        <section
            id="countdown"
            class="scene"
        >

            <div
                id="countNumber"
                class="count"
            >
                3
            </div>

        </section>


        <!-- SURYA -->

        <section
            id="surya"
            class="scene"
        >

            <div class="name">

                SURYA

            </div>

            <div class="sub">

                MY BEST FRIEND

            </div>

        </section>


        <!-- BIRTHDAY -->

        <section
            id="birthday"
            class="scene"
        >

            <div class="birthday">

                HAPPY BIRTHDAY

                <br>

                SURYA 🎂

            </div>

        </section>


        <!-- MESSAGE -->

        <section
            id="message"
            class="scene"
        >

            <div class="message">

                Friends are many...

                <br>

                but a

                <strong>
                    best friend like you
                </strong>

                is rare.

                <br>

                Keep smiling,
                keep rocking! ❤️

                <br><br>

                Happy Birthday,
                Surya! 🎉

            </div>

        </section>


        <!-- =================================
             PHOTOS
        ================================== -->

        <section
            id="photos"
            class="scene"
        >

            <!-- Memories removed.
                 Only HBD -->

            <div class="photo-title">

                HBD 🎂

            </div>


            <div class="photo-slideshow">


                <img
                    src="{{ url_for('static', filename='images/s1.jpg') }}"
                    class="photo-slide active"
                    alt="Surya Photo 1"
                >


                <img
                    src="{{ url_for('static', filename='images/s2.jpg') }}"
                    class="photo-slide"
                    alt="Surya Photo 2"
                >


                <img
                    src="{{ url_for('static', filename='images/s3.jpg') }}"
                    class="photo-slide"
                    alt="Surya Photo 3"
                >


            </div>


            <div class="photo-caption">

                ❤️

            </div>

        </section>


        <!-- SURPRISE -->

        <section
            id="surprise"
            class="scene"
        >

            <div class="heart">

                🎁

            </div>

            <br><br>

            <button
                id="surpriseButton"
                class="surprise-button"
            >

                ONE MORE SURPRISE 🎁

            </button>

        </section>


        <!-- FINAL -->

        <section
            id="final"
            class="scene"
        >

            <div class="heart">

                ❤️

            </div>


            <div class="final">

                SURYA

                <br>

                BEST FRIEND FOREVER

                <small>

                    HAPPY BIRTHDAY BRO! 🎉

                </small>

            </div>

        </section>


    </div>


    <div class="hint">

        SPACE = FIREWORKS

    </div>


</div>



<script>


/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let width = 0;
let height = 0;


function resizeCanvas() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width;

    canvas.height =
        height;
}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================
   STARS
========================================= */

const stars = [];


for (
    let i = 0;
    i < 220;
    i++
) {

    stars.push({

        x:
            Math.random() *
            window.innerWidth,

        y:
            Math.random() *
            window.innerHeight,

        radius:
            Math.random() * 1.8 + .3,

        speed:
            Math.random() * .5 + .1,

        phase:
            Math.random() *
            Math.PI * 2

    });

}


/* =========================================
   FIREWORKS
========================================= */

const fireworks = [];


function createFirework(
    x = width *
        (.2 + Math.random() * .6),

    y = height *
        (.15 + Math.random() * .4),

    amount = 130
) {

    const hue =
        Math.random() * 360;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;


        const speed =
            2 +
            Math.random() * 6;


        fireworks.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                50 +
                Math.random() * 60,

            hue: hue,

            size:
                1 +
                Math.random() * 3

        });

    }

}


/* =========================================
   HEART PARTICLES
========================================= */

const hearts = [];


function createHeart() {

    hearts.length = 0;


    for (
        let i = 0;
        i < 300;
        i++
    ) {

        const t =
            Math.random() *
            Math.PI * 2;


        const x =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );


        const y =
            13 *
                Math.cos(t)

            -
            5 *
                Math.cos(2 * t)

            -
            2 *
                Math.cos(3 * t)

            -
            Math.cos(4 * t);


        const scale =
            5 +
            Math.random() * 9;


        hearts.push({

            x:
                width / 2,

            y:
                height / 2,

            targetX:
                width / 2 +
                x * scale,

            targetY:
                height / 2 -
                y * scale,

            color:
                `hsl(
                    ${330 + Math.random() * 30},
                    100%,
                    ${60 + Math.random() * 30}%
                )`

        });

    }

}


/* =========================================
   CONFETTI
========================================= */

const confetti = [];


function createConfetti() {

    confetti.length = 0;


    for (
        let i = 0;
        i < 180;
        i++
    ) {

        confetti.push({

            x:
                Math.random() *
                width,

            y:
                -Math.random() *
                height,

            speed:
                2 +
                Math.random() * 5,

            rotation:
                Math.random() *
                Math.PI * 2,

            color:
                `hsl(
                    ${Math.random() * 360},
                    100%,
                    65%
                )`

        });

    }

}


/* =========================================
   ANIMATION
========================================= */

function animate() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* STARS */

    for (
        const star of stars
    ) {

        star.y +=
            star.speed;


        if (
            star.y > height
        ) {

            star.y = 0;

            star.x =
                Math.random() *
                width;

        }


        const alpha =
            .4 +
            .4 *
            Math.sin(
                performance.now() /
                700 +
                star.phase
            );


        ctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${alpha}
            )`;


        ctx.beginPath();


        ctx.arc(
            star.x,
            star.y,
            star.radius,
            0,
            Math.PI * 2
        );


        ctx.fill();

    }


    /* FIREWORKS */

    for (
        let i =
            fireworks.length - 1;

        i >= 0;

        i--
    ) {

        const particle =
            fireworks[i];


        particle.x +=
            particle.vx;

        particle.y +=
            particle.vy;


        particle.vy +=
            .04;


        particle.vx *=
            .99;

        particle.vy *=
            .99;


        particle.life--;


        ctx.fillStyle =
            `hsla(
                ${particle.hue},
                100%,
                65%,
                ${particle.life / 110}
            )`;


        ctx.beginPath();


        ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
        );


        ctx.fill();


        if (
            particle.life <= 0
        ) {

            fireworks.splice(
                i,
                1
            );

        }

    }


    /* HEART */

    for (
        const particle of hearts
    ) {

        particle.x +=
            (
                particle.targetX -
                particle.x
            ) * .055;


        particle.y +=
            (
                particle.targetY -
                particle.y
            ) * .055;


        ctx.fillStyle =
            particle.color;


        ctx.shadowBlur =
            15;


        ctx.shadowColor =
            particle.color;


        ctx.beginPath();


        ctx.arc(
            particle.x,
            particle.y,
            2.5,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.shadowBlur = 0;

    }


    /* CONFETTI */

    for (
        let i =
            confetti.length - 1;

        i >= 0;

        i--
    ) {

        const piece =
            confetti[i];


        piece.y +=
            piece.speed;


        piece.rotation +=
            .1;


        ctx.save();


        ctx.translate(
            piece.x,
            piece.y
        );


        ctx.rotate(
            piece.rotation
        );


        ctx.fillStyle =
            piece.color;


        ctx.fillRect(
            -3,
            -6,
            6,
            12
        );


        ctx.restore();


        if (
            piece.y >
            height + 20
        ) {

            confetti.splice(
                i,
                1
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


animate();


/* =========================================
   SCENE
========================================= */

function showScene(id) {

    document
        .querySelectorAll(".scene")
        .forEach(
            scene => {

                scene.classList.remove(
                    "active"
                );

            }
        );


    document
        .getElementById(id)
        .classList.add(
            "active"
        );

}


/* =========================================
   WAIT
========================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================
   MUSIC
========================================= */

const music =
    document.getElementById(
        "birthdayMusic"
    );


const musicButton =
    document.getElementById(
        "musicButton"
    );


let musicPlaying = false;


async function startMusic() {

    try {

        await music.play();

        musicPlaying = true;

        musicButton.textContent =
            "🎵 Music ON";

        console.log(
            "Music started successfully"
        );

    }

    catch (error) {

        console.log(
            "Music waiting for user click"
        );

    }

}


/* Music button */

musicButton.addEventListener(
    "click",
    async () => {

        if (
            musicPlaying
        ) {

            music.pause();

            musicPlaying = false;

            musicButton.textContent =
                "🎵 Music OFF";

        }

        else {

            await startMusic();

        }

    }
);


/* First page click */

document.addEventListener(
    "click",
    () => {

        if (
            !musicPlaying
        ) {

            startMusic();

        }

    },
    {
        once: true
    }
);


/* =========================================
   PHOTO SLIDESHOW
========================================= */

const photos =
    document.querySelectorAll(
        ".photo-slide"
    );


let currentPhoto = 0;


function nextPhoto() {

    if (
        photos.length === 0
    ) {

        return;

    }


    photos[
        currentPhoto
    ].classList.remove(
        "active"
    );


    currentPhoto++;


    if (
        currentPhoto >=
        photos.length
    ) {

        currentPhoto = 0;

    }


    photos[
        currentPhoto
    ].classList.add(
        "active"
    );

}


/* Every 4 seconds */

setInterval(
    nextPhoto,
    4000
);


/* =========================================
   MAIN BIRTHDAY SEQUENCE
========================================= */

async function startBirthday() {


    /* Loading */

    await wait(3000);


    /* Countdown */

    showScene(
        "countdown"
    );


    const counter =
        document.getElementById(
            "countNumber"
        );


    for (
        let number = 3;
        number >= 1;
        number--
    ) {

        counter.textContent =
            number;


        createFirework(
            width / 2,
            height / 2,
            70
        );


        await wait(1000);

    }


    /* SURYA */

    showScene(
        "surya"
    );


    createHeart();


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        createFirework();

        await wait(250);

    }


    await wait(3500);


    /* BIRTHDAY */

    showScene(
        "birthday"
    );


    createConfetti();


    for (
        let i = 0;
        i < 12;
        i++
    ) {

        createFirework();

        await wait(250);

    }


    await wait(3500);


    /* MESSAGE */

    showScene(
        "message"
    );


    await wait(4500);


    /* PHOTOS */

    showScene(
        "photos"
    );


    createConfetti();


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        createFirework();

        await wait(220);

    }


    await wait(12000);


    /* SURPRISE */

    showScene(
        "surprise"
    );

}


/* =========================================
   SURPRISE BUTTON
========================================= */

document
    .getElementById(
        "surpriseButton"
    )
    .addEventListener(
        "click",
        async () => {

            showScene(
                "final"
            );


            createHeart();

            createConfetti();


            for (
                let i = 0;
                i < 25;
                i++
            ) {

                createFirework();

                await wait(160);

            }

        }
    );


/* =========================================
   SPACE = FIREWORK
========================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            createFirework(
                width / 2,
                height * .35,
                160
            );

        }

    }
);


/* =========================================
   START
========================================= */

startBirthday();

</script>


</body>

</html>
